server:
  port: 8080

spring:
  application:
    name: meridiana
  datasource:
    url: jdbc:h2:file:./data/meridiana;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2
  jackson:
    serialization:
      write-dates-as-timestamps: false

meridiana:
  jwt-secret: ${MERIDIANA_JWT_SECRET:meridiana-local-dev-secret-change-me-32chars-min!!}
  jwt-hours: 12

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/meridiana}
    username: ${SPRING_DATASOURCE_USERNAME:meridiana}
    password: ${SPRING_DATASOURCE_PASSWORD:meridiana}
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
