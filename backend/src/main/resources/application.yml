server:
  port: 8080

spring:
  application:
    name: meridiana
  datasource:
    url: jdbc:h2:file:./data/meridiana;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2
  jackson:
    serialization:
      write-dates-as-timestamps: false

meridiana:
  jwt-secret: "meridiana-local-dev-secret-change-me-32chars-min!!"
  jwt-hours: 12

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/meridiana
    username: meridiana
    password: meridiana
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
