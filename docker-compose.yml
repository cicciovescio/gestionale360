version: "3.3"
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meridiana}
      POSTGRES_USER: ${POSTGRES_USER:-meridiana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridiana}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: api
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-meridiana}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-meridiana}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-meridiana}
      MERIDIANA_JWT_SECRET: ${MERIDIANA_JWT_SECRET:-meridiana-local-dev-secret-change-me-32chars-min!!}
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    container_name: web
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
